name: Python release tests
'on':
  pull_request:
    paths:
    - .github/actions/python-release/**
    - .github/actions/publish-python-release/**
    - .github/workflows/*python-release*.yml
    - .github/workflows/python-release-tests.yml
  push:
    branches:
    - main
    paths:
    - .github/actions/python-release/**
    - .github/actions/publish-python-release/**
    - .github/workflows/*python-release*.yml
    - .github/workflows/python-release-tests.yml
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version:
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m unittest discover -s .github/actions/python-release/tests -v
