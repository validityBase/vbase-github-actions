name: Repo Backup

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner label.
        required: false
        type: string
        default: ubuntu-latest
      python-version:
        description: Python version used for Bitwarden and backup helpers.
        required: false
        type: string
        default: "3.12"
      vbase-common-ref:
        description: Git ref of validityBase/vbase-common to install for Bitwarden helpers.
        required: false
        type: string
        default: v0.1.2
      bitwarden-project:
        description: Bitwarden project containing object storage backup credentials.
        required: false
        type: string
        default: vbase-repo-backups
      bitwarden-org-id:
        description: Bitwarden organization id for the backup secrets project.
        required: false
        type: string
        default: f8c92883-7bb9-4d29-a2d4-b137014f77af
      backup-prefix:
        description: Object storage prefix for backups.
        required: false
        type: string
        default: github-backups
      bundle-name:
        description: Backup bundle file name.
        required: false
        type: string
        default: repo.bundle
    secrets:
      VBASE_COMMON_REPO_READ_TOKEN:
        description: Token used to install validityBase/vbase-common.
        required: true
      BWS_ACCESS_TOKEN:
        description: Bitwarden machine access token scoped to the backup project.
        required: true

permissions:
  contents: read

jobs:
  repo-backup:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1
        with:
          fetch-depth: 0

      - name: Checkout shared action source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .vbase-github-actions

      - name: Create and upload backup
        uses: ./.vbase-github-actions/.github/actions/repo-backup
        with:
          python-version: ${{ inputs.python-version }}
          backup-prefix: ${{ inputs.backup-prefix }}
          bundle-name: ${{ inputs.bundle-name }}
          vbase-common-repo-read-token: ${{ secrets.VBASE_COMMON_REPO_READ_TOKEN }}
          vbase-common-ref: ${{ inputs.vbase-common-ref }}
          bitwarden-access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          bitwarden-project: ${{ inputs.bitwarden-project }}
          bitwarden-org-id: ${{ inputs.bitwarden-org-id }}
