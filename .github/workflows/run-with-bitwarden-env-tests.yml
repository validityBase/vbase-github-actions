name: Run with Bitwarden env tests

on:
  pull_request:
    paths:
      - ".github/actions/prepare-bitwarden-env/**"
      - ".github/actions/run-with-bitwarden-env/**"
      - ".github/workflows/run-with-bitwarden-env-tests.yml"
  push:
    branches:
      - main
    paths:
      - ".github/actions/prepare-bitwarden-env/**"
      - ".github/actions/run-with-bitwarden-env/**"
      - ".github/workflows/run-with-bitwarden-env-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Bitwarden env action unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python v6.2.0
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s .github/actions/run-with-bitwarden-env/scripts \
            -p 'test_*.py' \
            -v
          python -m unittest discover \
            -s .github/actions/prepare-bitwarden-env/scripts \
            -p 'test_*.py' \
            -v

  node-tests:
    name: Bitwarden session lifecycle tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .github/actions/prepare-bitwarden-env
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # actions/setup-node v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/actions/prepare-bitwarden-env/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Verify bundled action
        run: |
          npm run build
          git diff --exit-code -- dist/index.js
