name: Python release tools
description: Prepare and validate stable Python releases without importing caller package code.
inputs:
  operation:
    description: Operation to run; choose prepare to update version and changelog, or validate to check an existing release.
    required: true
  version-file:
    description: Repository-relative Python file containing one literal __version__ assignment.
    required: true
  changelog-file:
    description: Repository-relative Keep a Changelog file, starting with an [Unreleased] section.
    required: false
    default: CHANGELOG.md
  tag-prefix:
    description: Prefix before stable X.Y.Z tags; defaults to v.
    required: false
    default: v
  tag:
    description: Stable tag to validate, such as v1.2.3; required for validate and must match tag-prefix and the source version. Prereleases are rejected.
    required: false
    default: ''
  bump:
    description: Version increment to apply during prepare; required for prepare and must be patch, minor, or major.
    required: false
    default: ''
  dist-dir:
    description: Directory containing exactly one wheel and one source tarball to validate; leave empty to skip distribution checks. Requires package-name.
    required: false
    default: ''
  package-name:
    description: Expected PyPI distribution name when dist-dir is supplied; names are compared using Python package name normalization.
    required: false
    default: ''
  notes-file:
    description: Optional output path for extracted release notes or the generated Release PR body; may be outside the repository.
    required: false
    default: ''
outputs:
  version:
    description: Validated or prepared X.Y.Z version.
    value: ${{ steps.release.outputs.version }}
runs:
  using: composite
  steps:
  - id: release
    shell: bash
    env:
      OPERATION: ${{ inputs.operation }}
      VERSION_FILE: ${{ inputs.version-file }}
      CHANGELOG_FILE: ${{ inputs.changelog-file }}
      TAG_PREFIX: ${{ inputs.tag-prefix }}
      TAG: ${{ inputs.tag }}
      BUMP: ${{ inputs.bump }}
      DIST_DIR: ${{ inputs.dist-dir }}
      PACKAGE_NAME: ${{ inputs.package-name }}
      NOTES_FILE: ${{ inputs.notes-file }}
    run: python "$GITHUB_ACTION_PATH/scripts/release.py" "$OPERATION" --root "$GITHUB_WORKSPACE" --version-file
      "$VERSION_FILE" --changelog-file "$CHANGELOG_FILE" --tag-prefix "$TAG_PREFIX" --tag "$TAG" --bump "$BUMP"
      --dist-dir "$DIST_DIR" --package-name "$PACKAGE_NAME" --notes-file "$NOTES_FILE"
