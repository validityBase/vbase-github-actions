name: Repo Backup
description: >
  Creates a full-history git bundle for the checked-out caller repository,
  verifies it, writes checksum and metadata files, and uploads all backup
  artifacts to an S3-compatible object storage bucket.

inputs:
  backup-prefix:
    description: Object storage prefix for backups.
    required: false
    default: github-backups

  bundle-name:
    description: Backup bundle file name.
    required: false
    default: repo.bundle

  object-storage-access-key-id:
    description: Object storage access key ID.
    required: true

  object-storage-secret-access-key:
    description: Object storage secret access key.
    required: true

  object-storage-bucket-name:
    description: Object storage bucket name.
    required: true

  object-storage-endpoint-url:
    description: S3-compatible object storage endpoint URL.
    required: true

  object-storage-region:
    description: Object storage signing region.
    required: true

outputs:
  remote-prefix:
    description: Object storage prefix where backup artifacts were uploaded.
    value: ${{ steps.backup.outputs.remote-prefix }}
  bundle-path:
    description: Local path to the generated git bundle.
    value: ${{ steps.backup.outputs.bundle-path }}
  sha256-path:
    description: Local path to the generated SHA-256 checksum file.
    value: ${{ steps.backup.outputs.sha256-path }}
  metadata-path:
    description: Local path to the generated metadata file.
    value: ${{ steps.backup.outputs.metadata-path }}

runs:
  using: composite
  steps:
    - name: Create and upload repo backup
      id: backup
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        BACKUP_PREFIX: ${{ inputs.backup-prefix }}
        BUNDLE_NAME: ${{ inputs.bundle-name }}
        OBJECT_STORAGE_ACCESS_KEY_ID: ${{ inputs.object-storage-access-key-id }}
        OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ inputs.object-storage-secret-access-key }}
        OBJECT_STORAGE_BUCKET_NAME: ${{ inputs.object-storage-bucket-name }}
        OBJECT_STORAGE_ENDPOINT_URL: ${{ inputs.object-storage-endpoint-url }}
        OBJECT_STORAGE_REGION: ${{ inputs.object-storage-region }}
      run: python -m scripts.main
