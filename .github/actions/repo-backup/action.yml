name: Repo Backup
description: >
  Creates a full-history git bundle for the checked-out caller repository,
  verifies it, writes checksum and metadata files, and uploads all backup
  artifacts to an S3-compatible object storage bucket.

inputs:
  python-version:
    description: Python version used to run backup helper scripts.
    required: false
    default: "3.12"

  backup-prefix:
    description: Object storage prefix for backups.
    required: false
    default: github-backups

  bundle-name:
    description: Backup bundle file name.
    required: false
    default: repo.bundle

  vbase-common-repo-read-token:
    description: Token used to install the private vbase-common Bitwarden helper.
    required: false
    default: ""

  vbase-common-ref:
    description: Git ref of validityBase/vbase-common containing bw_sm.env.
    required: false
    default: v0.1.2

  bitwarden-access-token:
    description: Bitwarden machine access token for the backup secrets project.
    required: false
    default: ""

  bitwarden-project:
    description: Bitwarden project containing object storage backup credentials.
    required: false
    default: ""

  bitwarden-org-id:
    description: Bitwarden organization id for the backup secrets project.
    required: false
    default: f8c92883-7bb9-4d29-a2d4-b137014f77af

  object-storage-access-key-id:
    description: Object storage access key ID.
    required: false
    default: ""

  object-storage-secret-access-key:
    description: Object storage secret access key.
    required: false
    default: ""

  object-storage-bucket-name:
    description: Object storage bucket name.
    required: false
    default: ""

  object-storage-endpoint-url:
    description: S3-compatible object storage endpoint URL.
    required: false
    default: ""

  object-storage-region:
    description: Object storage signing region.
    required: false
    default: ""

outputs:
  remote-prefix:
    description: Object storage prefix where backup artifacts were uploaded.
    value: ${{ steps.backup.outputs.remote-prefix }}
  bundle-path:
    description: Local path to the generated git bundle.
    value: ${{ steps.backup.outputs.bundle-path }}
  sha256-path:
    description: Local path to the generated SHA-256 checksum file.
    value: ${{ steps.backup.outputs.sha256-path }}
  metadata-path:
    description: Local path to the generated metadata file.
    value: ${{ steps.backup.outputs.metadata-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Bitwarden helper dependencies
      if: ${{ inputs.bitwarden-access-token != '' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        VBASE_COMMON_REPO_READ_TOKEN: ${{ inputs.vbase-common-repo-read-token }}
        VBASE_COMMON_REF: ${{ inputs.vbase-common-ref }}
      run: python scripts/install_bitwarden_deps.py

    - name: Check AWS CLI
      shell: bash
      run: aws --version

    - name: Create and upload repo backup
      id: backup
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        BACKUP_PREFIX: ${{ inputs.backup-prefix }}
        BUNDLE_NAME: ${{ inputs.bundle-name }}
        REPO_BACKUP_BITWARDEN_ACCESS_TOKEN: ${{ inputs.bitwarden-access-token }}
        REPO_BACKUP_BITWARDEN_PROJECT: ${{ inputs.bitwarden-project }}
        REPO_BACKUP_BITWARDEN_ORG_ID: ${{ inputs.bitwarden-org-id }}
        OBJECT_STORAGE_ACCESS_KEY_ID: ${{ inputs.object-storage-access-key-id }}
        OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ inputs.object-storage-secret-access-key }}
        OBJECT_STORAGE_BUCKET_NAME: ${{ inputs.object-storage-bucket-name }}
        OBJECT_STORAGE_ENDPOINT_URL: ${{ inputs.object-storage-endpoint-url }}
        OBJECT_STORAGE_REGION: ${{ inputs.object-storage-region }}
      run: python -m scripts.run_backup
