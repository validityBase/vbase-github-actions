name: Run with Bitwarden env
description: >
  Run a command with Bitwarden project secrets in its environment or in
  temporary dotenv files, with secret redaction scoped to that command.
# cspell:ignore btenv pipefail

inputs:
  command:
    description: Bash command to run after loading Bitwarden project secrets.
    required: true
  bitwarden-access-token:
    description: Bitwarden machine access token for the selected project.
    required: false
    default: ""
  project:
    description: Bitwarden project name.
    required: false
    default: ""
  project-id:
    description: Bitwarden project id. Use when project is omitted.
    required: false
    default: ""
  org-id:
    description: Bitwarden organization id.
    required: false
    default: f8c92883-7bb9-4d29-a2d4-b137014f77af
  token-env:
    description: >
      Environment variable name used to pass the Bitwarden access token to bw_sm.env.
    required: false
    default: BWS_ACCESS_TOKEN
  backend:
    description: Bitwarden backend passed to bw_sm.env.
    required: false
    default: api
  projects-json:
    description: >
      JSON array describing Bitwarden projects to write to temporary dotenv
      files. Each entry requires project or project-id, token-env, and
      env-file-variable. This mode cannot be combined with the single-project
      inputs.
    required: false
    default: ""
  working-directory:
    description: Directory where the command should run.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        BTENV_COMMAND: ${{ inputs.command }}
        BTENV_PROJECT: ${{ inputs.project }}
        BTENV_PROJECT_ID: ${{ inputs.project-id }}
        BTENV_TOKEN_ENV: ${{ inputs.token-env }}
        BTENV_ACCESS_TOKEN: ${{ inputs.bitwarden-access-token }}
        BTENV_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        BTENV_PROJECTS_JSON: ${{ inputs.projects-json }}
      run: |
        set -euo pipefail

        if [ -z "$BTENV_COMMAND" ]; then
          echo "command input must not be empty" >&2
          exit 1
        fi

        if [ -z "$BTENV_WORKING_DIRECTORY" ]; then
          echo "working-directory input must not be empty" >&2
          exit 1
        fi

        if [ ! -d "$BTENV_WORKING_DIRECTORY" ]; then
          echo "working-directory must exist and be a directory: $BTENV_WORKING_DIRECTORY" >&2
          exit 1
        fi

        if [ -n "$BTENV_PROJECTS_JSON" ]; then
          if [ -n "$BTENV_PROJECT" ] || [ -n "$BTENV_PROJECT_ID" ] || [ -n "$BTENV_ACCESS_TOKEN" ]; then
            echo "projects-json cannot be combined with project, project-id, or bitwarden-access-token" >&2
            exit 1
          fi
        else
          if [ -z "$BTENV_PROJECT" ] && [ -z "$BTENV_PROJECT_ID" ]; then
            echo "project or project-id input must be provided" >&2
            exit 1
          fi

          if [[ ! "$BTENV_TOKEN_ENV" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "token-env must be a valid shell environment variable name" >&2
            exit 1
          fi

          if [ -z "$BTENV_ACCESS_TOKEN" ]; then
            echo "bitwarden-access-token input must not be empty" >&2
            exit 1
          fi
        fi

    - name: Run command with Bitwarden env
      if: ${{ inputs.projects-json == '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BTENV_ACTION_PATH: ${{ github.action_path }}
        BTENV_COMMAND: ${{ inputs.command }}
        BTENV_PROJECT: ${{ inputs.project }}
        BTENV_PROJECT_ID: ${{ inputs.project-id }}
        BTENV_ORG_ID: ${{ inputs.org-id }}
        BTENV_TOKEN_ENV: ${{ inputs.token-env }}
        BTENV_ACCESS_TOKEN: ${{ inputs.bitwarden-access-token }}
        BTENV_BACKEND: ${{ inputs.backend }}
      run: |
        set -euo pipefail
        python "$BTENV_ACTION_PATH/scripts/run_with_env.py"

    - name: Run command with Bitwarden env files
      if: ${{ inputs.projects-json != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BTENV_ACTION_PATH: ${{ github.action_path }}
        BTENV_COMMAND: ${{ inputs.command }}
        BTENV_ORG_ID: ${{ inputs.org-id }}
        BTENV_BACKEND: ${{ inputs.backend }}
        BTENV_PROJECTS_JSON: ${{ inputs.projects-json }}
      run: |
        set -euo pipefail
        python "$BTENV_ACTION_PATH/scripts/run_with_env_files.py"
