name: Publish Python release
description: Upload a built artifact from a caller-owned OIDC job, preserving its trusted-publisher identity.
inputs:
  artifact-name:
    description: Validated distribution artifact name.
    default: python-package-distributions
  dist-dir:
    description: Directory to download and publish.
    default: dist
runs:
  using: composite
  steps:
  - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
    with:
      name: ${{ inputs.artifact-name }}
      path: ${{ inputs.dist-dir }}
  - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
    with:
      packages-dir: ${{ inputs.dist-dir }}
